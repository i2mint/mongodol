[build-system]
requires = [
    "hatchling",
]
build-backend = "hatchling.build"

[project]
name = "mongodol"
version = "0.1.5"
description = "MongoDB Data Object Layer"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
keywords = [
    "mongodb",
    "mongo",
    "pymongo",
    "storage",
    "key-value",
    "mapping",
    "dol",
    "data-object-layer",
]
authors = [
    { name = "Thor Whalen" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Topic :: Database",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "pymongo[srv]==3.12.1",
    "dol",
    "i2",
    "linkup",
]

[project.urls]
Homepage = "https://github.com/i2mint/mongodol"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.1.0",
]
docs = [
    "epythet",
]

# The package __init__ imports mongodol.tests.util, so the tests subpackage
# must ship in the wheel (importing mongodol would otherwise break post-install).
[tool.hatch.build.targets.wheel]
packages = [
    "mongodol",
]

[tool.ruff]
line-length = 88
target-version = "py310"
exclude = [
    "**/*.ipynb",
    ".git",
    ".venv",
    "build",
    "dist",
    "mongodol/scrap",
    "mongodol/tests",
]

[tool.ruff.lint]
select = [
    "D100",
]
ignore = [
    "D203",
    "E501",
    "B905",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"**/tests/*" = [
    "D",
]
"**/scrap/*" = [
    "D",
]

[tool.pytest.ini_options]
minversion = "6.0"
testpaths = [
    "mongodol",
]
doctest_optionflags = [
    "NORMALIZE_WHITESPACE",
    "ELLIPSIS",
    "IGNORE_EXCEPTION_DETAIL",
]

[tool.wads.ci]
project_name = "mongodol"

[tool.wads.ci.commands]
pre_test = []
test = []
post_test = []
lint = []
format = []

[tool.wads.ci.env]
required_envvars = []
test_envvars = []
extra_envvars = []

[tool.wads.ci.env.defaults]

[tool.wads.ci.quality.ruff]
enabled = true

[tool.wads.ci.quality.black]
enabled = false

[tool.wads.ci.quality.mypy]
enabled = false

[tool.wads.ci.testing]
python_versions = [
    "3.10",
]
pytest_args = [
    "-v",
    "--tb=short",
]
coverage_enabled = true
coverage_threshold = 0
coverage_report_format = [
    "term",
    "xml",
]
exclude_paths = [
    "mongodol/scrap",
]
test_on_windows = false

[tool.wads.ci.build]
sdist = true
wheel = true

[tool.wads.ci.publish]
enabled = true

[tool.wads.ci.docs]
enabled = true
builder = "epythet"
ignore_paths = [
    "mongodol/tests/",
    "mongodol/scrap/",
]
